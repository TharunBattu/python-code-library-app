---
services:
  db:
    container_name: db
    build: database
    volumes:
      - mysql-volume:/var/lib/mysql/
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      start_period: 30s
      interval: 15s
      timeout: 20s
      retries: 3

  auth_service:
    container_name: auth
    build: auth
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy

  book_service:
    container_name: book
    build: book
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy


  borrow_service:
    container_name: borrow
    build: borrow
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy


  app:
    container_name: app
    build: .
    ports:
      - "8080:5000"
    deploy:
      replicas: 2
    depends_on:
      - auth_service
      - book_service
      - borrow_service


volumes:
  mysql-volume:
      
...
