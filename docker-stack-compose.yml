---
services:
  db:
    container_name: db
    image: tharunbattu1/library-app:db
    volumes:
      - mysql-volume:/var/lib/mysql/
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      start_period: 30s
      interval: 15s
      timeout: 20s
      retries: 3

  auth_service:
    image: tharunbattu1/library-app:auth_service
    deploy:
      replicas: 2
    depends_on:
      - db

  book_service:
    image: tharunbattu1/library-app:book_service
    deploy:
      replicas: 2
    depends_on:
      - db


  borrow_service:
    image: tharunbattu1/library-app:borrow_service
    deploy:
      replicas: 2
    depends_on:
      - db


  app:
    image: tharunbattu1/library-app:frontend
    ports:
      - "8080:5000"
    deploy:
      replicas: 2
    depends_on:
      - auth_service
      - book_service
      - borrow_service


volumes:
  mysql-volume:
      
...
